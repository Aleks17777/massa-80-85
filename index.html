<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json">
<title>Масса 80→85</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0b1220;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#0b1220;color:white;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
h1{margin:0;font-size:24px}.muted{color:#718096;font-size:12px}.white{color:#cbd5e1}
main{max-width:760px;margin:auto;padding:14px 14px 95px}.page{display:none}.page.active{display:block}
.card{background:white;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px #0b12200b}
.hero{background:#0b1220;color:white}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border-radius:14px;padding:12px}.hero .stat{background:#172033}.big{font-size:22px;font-weight:850}.bar{height:9px;background:#dfe5ed;border-radius:9px;overflow:hidden}.fill{height:100%;background:#fff;width:0}
select,input{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:11px;background:#fff;font-size:16px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px}.primary{background:#0b1220;color:white}.secondary{background:#e8edf4;color:#0b1220}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:20;padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-right))}
.nav button{flex:1;background:transparent;color:#64748b;font-size:11px;padding:8px 3px}.nav button.active{color:#0b1220}
.exercise{padding:14px 0;border-top:1px solid #edf0f4}.exercise:first-child{border-top:0}.name{font-weight:850}.meta{font-size:12px;color:#718096;margin-top:3px}
.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-block;background:#e9eef5;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800}
.exercise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.exercise-title{min-width:0}.exercise-timers{display:flex;gap:6px;flex-shrink:0}.mini-timer{background:#f7f9fc;border:1px solid #dfe5ed;border-radius:10px;padding:5px 6px;text-align:center;min-width:64px}.mini-timer .secs{font-size:18px;font-weight:900;line-height:1.1}.mini-timer .label{font-size:10px;color:#718096;margin-top:2px}.timer-buttons{display:flex;gap:4px;margin-top:4px}.timer-buttons button{font-size:10px;padding:4px 5px}.timer-running{border-color:#0b1220}.foodrow{padding:11px 0;border-top:1px solid #edf0f4}.foodrow:first-child{border-top:0}
.history{padding:10px 0;border-top:1px solid #edf0f4}.history:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#0b1220;color:white;padding:11px 16px;border-radius:12px;display:none;z-index:50}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}.inputs{grid-template-columns:1fr 1fr 1fr}}
</style></head>
<body>
<header><h1>Масса 80 → 85</h1><div class="white">12 недель • тренировки • питание • прогресс</div></header>

<main>
<section id="home" class="page active">
<div class="card hero"><div class="muted white">Текущий вес</div><div class="big" id="cur">80.0 кг</div><br><div class="bar"><div class="fill" id="bar"></div></div><p class="white" id="remaining">До цели 5.0 кг</p>
<div class="grid3"><div class="stat"><div class="muted">Цель</div><div class="big">85</div><div class="muted">кг</div></div><div class="stat"><div class="muted">Тренировки</div><div class="big" id="count">0</div><div class="muted">из 36</div></div><div class="stat"><div class="muted">Белок</div><div class="big">140–160</div><div class="muted">г/день</div></div></div></div>
<div class="card"><h2>Следующая тренировка</h2><div id="next"></div><br><button class="primary" onclick="go('gym')">Открыть</button></div>
<div class="card"><h2>Быстрый вес</h2><div class="actions"><input id="qw" type="number" step=".1" placeholder="Вес, кг"><input id="qt" type="number" step=".1" placeholder="Талия, см"></div><br><button class="primary" onclick="quick()">Сохранить</button></div>
</section>

<section id="gym" class="page">
<div class="card"><div class="grid3"><select id="week" onchange="renderGym()"></select><select id="day" onchange="renderGym()"><option>Пн</option><option>Ср</option><option>Пт</option></select><button class="secondary" onclick="suggest()">Мой вес</button></div><div class="actions" style="margin-top:8px"><button class="secondary" id="day-pn" onclick="setDay('Пн')">Пн</button><button class="secondary" id="day-sr" onclick="setDay('Ср')">Ср</button><button class="secondary" id="day-pt" onclick="setDay('Пт')">Пт</button></div></div>
<div class="card" id="gymcard"></div>

</section>

<section id="food" class="page">
<div class="card"><h2>Питание</h2><div class="grid3"><div class="stat"><div class="muted">Ккал</div><div class="big">2800–2900</div></div><div class="stat"><div class="muted">Белок</div><div class="big">140–160</div></div><div class="stat"><div class="muted">Креатин</div><div class="big">3–5 г</div></div></div><br><select id="foodday" onchange="renderFood()"><option>Пн</option><option>Вт</option><option>Ср</option><option>Чт</option><option>Пт</option><option>Сб</option><option>Вс</option></select></div>
<div class="card" id="foodcard"></div>
</section>

<section id="progress" class="page">
<div class="card"><h2>Замеры тела</h2><div class="grid3"><input id="pw" type="number" step=".1" placeholder="Вес кг"><input id="pt" type="number" step=".1" placeholder="Талия см"><input id="pc" type="number" step=".1" placeholder="Грудь см"></div><br><input id="pa" type="number" step=".1" placeholder="Бицепс, см"><br><br><button class="primary" onclick="measure()">Сохранить</button></div>
<div class="card"><h2>История</h2><div id="hist"></div></div>
<div class="card"><h2>Резервная копия</h2><button class="secondary" onclick="backup()">Экспорт</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Импорт</button> <button class="secondary" onclick="resetAll()">Сбросить</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></div>
</section>
</main>
<div class="toast" id="toast"></div>
<div class="nav"><button onclick="go('home')" id="n-home">⌂<br>Главная</button><button onclick="go('gym')" id="n-gym">🏋️<br>Зал</button><button onclick="go('food')" id="n-food">🍚<br>Питание</button><button onclick="go('progress')" id="n-progress">📈<br>Прогресс</button></div>

<script>
const A=[["Жим ногами",3,"10–12"],["Жим гантелей лёжа",3,"8–12"],["Тяга верхнего блока",3,"10–12"],["Румынская тяга",2,"10–12"],["Жим гантелей сидя",2,"10–12"],["Бицепс",2,"10–12"],["Пресс",2,"12–15"]];
const B=[["Гоблет-присед",3,"10–12"],["Жим в тренажёре",3,"10–12"],["Горизонтальная тяга",3,"10–12"],["Сгибание ног",2,"10–12"],["Разведения в стороны",2,"12–15"],["Трицепс",2,"10–12"],["Пресс",2,"12–15"]];
const MENU={Пн:["Овсянка 80 г + 3 яйца + банан","Рис 100 г + курица 180 г + овощи","Йогурт 200 г + банан + хлеб 60 г","Рис 80 г + говядина 150 г + овощи","Творог/йогурт 200 г + орехи 20 г"],Вт:["3 яйца + хлеб 100 г + авокадо + фрукт","Рис 100 г + нежирная свинина 180 г + овощи","Йогурт 250 г + банан + орехи","Картофель 400 г + рыба 180 г + овощи","Творог/йогурт 200 г"],Ср:["Овсянка 80 г + молоко + яйца + банан","Рис 100 г + рыба 180 г + овощи","Йогурт + банан + хлеб","Макароны 100 г + говядина 180 г + овощи","Творог 200 г"],Чт:["Овсянка 80 г + молоко + 3 яйца","Макароны 100 г + говядина 180 г + овощи","Йогурт + фрукт + орехи","Рис 100 г + рыба 180 г + овощи","Творог 200 г"],Пт:["Овсянка 80 г + 3 яйца + банан","Рис 100 г + курица 180 г + овощи","Банан + йогурт + хлеб","Картофель 400 г + говядина 170 г + овощи","Творог + орехи"],Сб:["Яйца + bánh mì + фрукт","Cơm + мясо + овощи","Йогурт + банан + орехи","Рис + рыба/морепродукты + овощи","Йогурт"],Вс:["Овсянка + яйца + фрукт","Рис + мясо + овощи","Йогурт + банан + орехи","Картофель/рис + рыба + овощи","Творог/йогурт"]};
let D=JSON.parse(localStorage.getItem("mass85v3")||'{"logs":{},"food":{},"m":[]}');
D.logs=D.logs||{}; D.food=D.food||{}; D.m=Array.isArray(D.m)?D.m:[]; D.timers=D.timers||{}; D.completed=D.completed||{}; D.unlocked=D.unlocked||{};
const workoutOrder=[]; for(let ww=1;ww<=12;ww++) for(const dd of ["Пн","Ср","Пт"]) workoutOrder.push(ww+"-"+dd);
function workoutIndex(k){return workoutOrder.indexOf(k)}
// One-time migration: the last real workout is the boundary. Remove accidental future entries.
if(!D.protectionV1){
  let boundary=D.lastWorkout?workoutIndex(D.lastWorkout):-1;
  if(boundary>=0){
    workoutOrder.forEach((k,idx)=>{if(idx<=boundary && D.logs[k] && Object.keys(D.logs[k]).length)D.completed[k]=true;});
    Object.keys(D.logs).forEach(k=>{if(workoutIndex(k)>boundary)delete D.logs[k];});
    Object.keys(D.timers).forEach(k=>{if(workoutIndex(k)>boundary)delete D.timers[k];});
  }
  D.protectionV1=true; localStorage.setItem("mass85v3",JSON.stringify(D));
}
let timerIntervals={};

for(let i=1;i<=12;i++)week.innerHTML+=`<option>${i}</option>`;
function save(){localStorage.setItem("mass85v3",JSON.stringify(D))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1300)}
function type(w,d){return w%2?(d=="Ср"?"B":"A"):(d=="Ср"?"A":"B")}


function completedCount(){return workoutOrder.filter(k=>D.completed[k]).length}
function nextWorkoutKey(){let i=workoutOrder.findIndex(k=>!D.completed[k]);return i>=0?workoutOrder[i]:null}
function canEditWorkout(k){return k===nextWorkoutKey() || !!D.unlocked[k]}
function toggleUnlock(k){
  if(!D.completed[k])return;
  if(D.unlocked[k]) delete D.unlocked[k]; else D.unlocked[k]=true;
  save();renderGym();toast(D.unlocked[k]?"Старая тренировка разблокирована":"Редактирование заблокировано");
}

function latestWorkoutKey(){
  if(D.lastWorkout && D.logs[D.lastWorkout]) return D.lastWorkout;
  let keys=Object.keys(D.logs).filter(k=>D.logs[k]&&Object.keys(D.logs[k]).length);
  return keys.length?keys[keys.length-1]:null;
}
function openLastWorkout(){
  let k=latestWorkoutKey();
  if(k){let p=k.split("-");week.value=p[0];day.value=p.slice(1).join("-");}
  renderGym();
}
function go(id){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  document.getElementById("n-"+id).classList.add("active");
  if(id=="gym")openLastWorkout();
  if(id=="food")renderFood();
  if(id=="progress")renderHist();
  renderHome();
}
function setDay(d){day.value=d;renderGym()}

function normalizedSets(z,n){
  if(Array.isArray(z?.sets)) return z.sets.slice(0,n).concat(Array(Math.max(0,n-z.sets.length)).fill(0).map(()=>({weight:"",reps:"",rir:""})));
  if(z && (z.weight!==undefined || z.reps!==undefined || z.rir!==undefined))
    return [{weight:z.weight||"",reps:z.reps||"",rir:z.rir||""}].concat(Array(Math.max(0,n-1)).fill(0).map(()=>({weight:"",reps:"",rir:""})));
  return Array(n).fill(0).map(()=>({weight:"",reps:"",rir:""}));
}

function timerState(k,i){
  D.timers[k]=D.timers[k]||{};
  D.timers[k][i]=D.timers[k][i]||{t60:0,t120:0};
  return D.timers[k][i];
}
function startExerciseTimers(k,i){
  let t=timerState(k,i), now=Date.now();
  t.t60=now+60000; t.t120=now+120000;
  save(); runExerciseTimers(k,i);
}
function runExerciseTimers(k,i){
  let id=k+"-"+i;
  clearInterval(timerIntervals[id]);
  updateExerciseTimers(k,i);
  timerIntervals[id]=setInterval(()=>updateExerciseTimers(k,i),250);
}
function updateExerciseTimers(k,i){
  let t=timerState(k,i), now=Date.now();
  let s60=Math.max(0,Math.ceil((t.t60-now)/1000)), s120=Math.max(0,Math.ceil((t.t120-now)/1000));
  let a=document.getElementById("tm60-"+i), b=document.getElementById("tm120-"+i);
  if(a)a.textContent=String(Math.floor(s60/60)).padStart(2,"0")+":"+String(s60%60).padStart(2,"0");
  if(b)b.textContent=String(Math.floor(s120/60)).padStart(2,"0")+":"+String(s120%60).padStart(2,"0");
  if(s60<=0 && t.t60){t.t60=0;if(navigator.vibrate)navigator.vibrate([180,100,180]);toast("60 сек — "+getExerciseName(i,k));}
  if(s120<=0 && t.t120){t.t120=0;if(navigator.vibrate)navigator.vibrate([300,150,300]);toast("120 сек — "+getExerciseName(i,k));}
  if(!t.t60&&!t.t120){clearInterval(timerIntervals[k+"-"+i]);delete timerIntervals[k+"-"+i];save();}
}
function getExerciseName(i,k){
  let p=k.split("-"),ex=type(+p[0],p.slice(1).join("-"))=="A"?A:B;
  return ex[i]?ex[i][0]:"упражнение";
}
function resetOneTimer(k,i,sec){
  let t=timerState(k,i);
  if(sec===60)t.t60=Date.now()+60000;
  if(sec===120)t.t120=Date.now()+120000;
  save();runExerciseTimers(k,i);
}

function updateSet(k,i,j,field,value){
  if(!canEditWorkout(k)){toast("Доступна только следующая тренировка");renderGym();return;}
  D.logs[k] ||= {};
  let ex=type(+week.value,day.value)=="A"?A:B;
  D.logs[k][i] ||= {};
  D.logs[k][i].sets=normalizedSets(D.logs[k][i],ex[i][1]);
  let oldValue=D.logs[k][i].sets[j][field]||"";
  D.logs[k][i].sets[j][field]=value;
  save();
  if(field=="weight" && !oldValue && value)startExerciseTimers(k,i);
}

function renderGym(){
  let w=+week.value,d=day.value,t=type(w,d),ex=t=="A"?A:B,k=w+"-"+d,s=D.logs[k]||{};
  let editable=canEditWorkout(k), completed=!!D.completed[k], nextKey=nextWorkoutKey();
  let status=completed?(editable?"Завершена • редактирование открыто":"Завершена • только просмотр"):(k===nextKey?"Следующая тренировка • ввод доступен":"Будущая тренировка • поля заблокированы");
  gymcard.innerHTML=`<h2>Неделя ${w} • ${d} <span class="tag">${t}</span></h2><div class="meta" style="margin-bottom:10px">${status}</div>`+
  ex.map((e,i)=>{
    let z=s[i]||{},sets=normalizedSets(z,e[1]),ts=timerState(k,i);
    let r60=ts.t60?Math.max(0,Math.ceil((ts.t60-Date.now())/1000)):0;
    let r120=ts.t120?Math.max(0,Math.ceil((ts.t120-Date.now())/1000)):0;
    let dis=editable?"":" disabled";
    return `<div class="exercise"><div class="exercise-head">
      <div class="exercise-title"><div class="name">${e[0]}</div><div class="meta">${e[1]} подхода • ${e[2]} повторений</div></div>
      <div class="exercise-timers">
        <div class="mini-timer ${r60>0?"timer-running":""}"><div class="secs" id="tm60-${i}">${String(Math.floor(r60/60)).padStart(2,"0")}:${String(r60%60).padStart(2,"0")}</div><div class="label">60 сек</div><div class="timer-buttons"><button class="secondary" ${editable?"":"disabled"} onclick="resetOneTimer('${k}',${i},60)">60</button></div></div>
        <div class="mini-timer ${r120>0?"timer-running":""}"><div class="secs" id="tm120-${i}">${String(Math.floor(r120/60)).padStart(2,"0")}:${String(r120%60).padStart(2,"0")}</div><div class="label">120 сек</div><div class="timer-buttons"><button class="secondary" ${editable?"":"disabled"} onclick="resetOneTimer('${k}',${i},120)">120</button></div></div>
      </div></div>`+
      sets.map((set,j)=>`<div style="margin-top:8px"><div class="meta">Подход ${j+1}</div><div class="inputs"><input id="w${i}_${j}" type="number" step=".5" placeholder="Вес кг" value="${set.weight||''}"${dis} oninput="updateSet('${k}',${i},${j},'weight',this.value)"><input id="r${i}_${j}" type="number" placeholder="Повторы" value="${set.reps||''}"${dis} oninput="updateSet('${k}',${i},${j},'reps',this.value)"><input id="q${i}_${j}" type="number" placeholder="RIR" value="${set.rir||''}"${dis} oninput="updateSet('${k}',${i},${j},'rir',this.value)"></div></div>`).join("")+
      `</div>`;
  }).join("")+
  (completed?`<button class="secondary" onclick="toggleUnlock('${k}')">${editable?"🔒 Заблокировать изменения":"✏️ Исправить прошлую тренировку"}</button>`:(k===nextKey?`<button class="primary" onclick="saveGym('${k}')">✓ Завершить тренировку</button>`:`<button class="secondary" disabled>🔒 Сначала заверши предыдущую тренировку</button>`));
  ex.forEach((e,i)=>{let ts=timerState(k,i);if(ts.t60||ts.t120)runExerciseTimers(k,i);});
}

function saveGym(k){
  if(k!==nextWorkoutKey() && !D.unlocked[k]){toast("Сначала заверши предыдущую тренировку");return;}
  D.logs[k] ||= {};
  let w=+week.value,d=day.value,ex=type(w,d)=="A"?A:B;
  ex.forEach((e,i)=>{
    D.logs[k][i] ||= {};
    D.logs[k][i].sets=normalizedSets(D.logs[k][i],e[1]);
    for(let j=0;j<e[1];j++){
      D.logs[k][i].sets[j].weight=document.getElementById(`w${i}_${j}`).value;
      D.logs[k][i].sets[j].reps=document.getElementById(`r${i}_${j}`).value;
      D.logs[k][i].sets[j].rir=document.getElementById(`q${i}_${j}`).value;
    }
  });
  D.completed[k]=true; delete D.unlocked[k]; D.lastWorkout=k; save();toast("Тренировка завершена");renderHome();renderGym();
}

function suggest(){let w=+week.value,d=day.value,k=w+"-"+d,s=D.logs[k];if(!s){toast("Сначала введи стартовый вес");return}toast("Используй последний записанный вес; при верхней границе повторов прибавь минимальный шаг")}
function renderFood(){let d=foodday.value,s=D.food[d]||{};foodcard.innerHTML=MENU[d].map((x,i)=>`<div class="foodrow"><b>Приём ${i+1}</b><br>${x}<div class="inputs"><input id="fk${i}" type="number" placeholder="ккал" value="${s[i]?.k||''}"><input id="fp${i}" type="number" placeholder="белок г" value="${s[i]?.p||''}"><span></span></div></div>`).join("")+`<br><button class="primary" onclick="saveFood('${d}')">Сохранить питание</button>`}
function saveFood(d){let o={};for(let i=0;i<5;i++)o[i]={k:document.getElementById("fk"+i).value,p:document.getElementById("fp"+i).value};D.food[d]=o;save();toast("Питание сохранено")}
function quick(){if(!qw.value)return;D.m.push({date:new Date().toLocaleDateString("ru-RU"),w:+qw.value,t:+qt.value||null});save();qw.value=qt.value="";renderHome();renderHist();toast("Вес сохранён")}
function measure(){let o={date:new Date().toLocaleDateString("ru-RU"),w:+pw.value||null,t:+pt.value||null,c:+pc.value||null,a:+pa.value||null};if(!o.w&&!o.t&&!o.c&&!o.a)return;D.m.push(o);save();[pw,pt,pc,pa].forEach(x=>x.value="");renderHome();renderHist();toast("Замеры сохранены")}
function renderHist(){hist.innerHTML=D.m.length?D.m.slice().reverse().map(x=>`<div class="history"><b>${x.date}</b> — ${x.w?x.w+" кг":""} ${x.t?"• "+x.t+" см талия":""} ${x.c?"• "+x.c+" см грудь":""} ${x.a?"• "+x.a+" см бицепс":""}</div>`).join(""):"Нет записей."}
function renderHome(){let w=D.m.length?(D.m[D.m.length-1].w||80):80;cur.textContent=w.toFixed(1)+" кг";bar.style.width=Math.max(0,Math.min(100,(w-80)/5*100))+"%";remaining.textContent=w>=85?"🎯 Цель 85 кг достигнута!":"До цели "+Math.max(0,85-w).toFixed(1)+" кг";let cc=completedCount();count.textContent=cc;let nk=nextWorkoutKey();next.innerHTML=nk?`Следующая тренировка — неделя ${nk.split("-")[0]}, ${nk.split("-")[1]}.`:"Все 36 тренировок завершены."}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="mass85-backup.json";a.click()}
function importBackup(input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=="object"||typeof x.logs!=="object")throw new Error("bad");if(!confirm("Заменить текущие данные данными из резервной копии?")){input.value="";return}D={...x,logs:x.logs||{},food:x.food||{},m:Array.isArray(x.m)?x.m:[],timers:x.timers||{},lastWorkout:x.lastWorkout||null,completed:x.completed||{},unlocked:{}}; D.protectionV1=x.protectionV1||false; if(!D.protectionV1){let boundary=D.lastWorkout?workoutIndex(D.lastWorkout):-1;if(boundary>=0){workoutOrder.forEach((k,idx)=>{if(idx<=boundary&&D.logs[k]&&Object.keys(D.logs[k]).length)D.completed[k]=true;});Object.keys(D.logs).forEach(k=>{if(workoutIndex(k)>boundary)delete D.logs[k];});Object.keys(D.timers).forEach(k=>{if(workoutIndex(k)>boundary)delete D.timers[k];});}D.protectionV1=true;}save();renderHome();openLastWorkout();renderFood();renderHist();Object.keys(D.timers).forEach(k=>Object.keys(D.timers[k]||{}).forEach(i=>{let t=D.timers[k][i];if(t&&(t.t60||t.t120))runExerciseTimers(k,i)}));toast("Данные восстановлены")}catch(e){toast("Не удалось импортировать резервную копию") }input.value=""};r.readAsText(f)}
function resetAll(){if(confirm("Удалить все записи?")){Object.values(timerIntervals).forEach(clearInterval);timerIntervals={};D={logs:{},food:{},m:[],timers:{},lastWorkout:null,completed:{},unlocked:{},protectionV1:true};save();renderHome();renderHist();openLastWorkout();toast("Данные сброшены")}}
renderHome();openLastWorkout();renderFood();renderHist();
Object.keys(D.timers).forEach(k=>Object.keys(D.timers[k]||{}).forEach(i=>{let t=D.timers[k][i];if(t&&(t.t60||t.t120))runExerciseTimers(k,i)}));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
